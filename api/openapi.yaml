            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Error (400,401,403,404,410,429,500,503). 429 and busy503 include Retry-After.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Initial reset projection waits at most one second for the existing bounded read admission; sustained saturation returns 503. Existing stream ticks coalesce temporary read pressure."
      }
    }
