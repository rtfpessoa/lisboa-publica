name: lisboa-publica
services:
  dashboard:
    image: lisboa-publica:${VERSION:?set VERSION to the deployed Git commit}
    build:
      context: ..
      args:
        VERSION: ${VERSION:?set VERSION}
    environment:
      DATABASE_URL: postgresql://lisboapublica:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/lisboapublica?sslmode=disable
      ENVIRONMENT: production
      PUBLIC_ORIGIN: https://lisboapublica.rtfpessoa.xyz
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_READS: "true"
      DEV_AUTH: "false"
      RATE_LIMIT_PER_MINUTE: "300"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set the existing Caddy network subnet}
      INGEST_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:?select retention to fit available storage}
      HISTORY_INTERVAL_SECONDS: ${HISTORY_INTERVAL_SECONDS:-300}
      TRANSPORT_ARCHIVE_DIR: /app/transport-history
      TRANSPORT_ARCHIVE_OPERATORS: ${TRANSPORT_ARCHIVE_OPERATORS:-metro}
      TRANSPORT_ARCHIVE_LIMIT_BYTES: ${TRANSPORT_ARCHIVE_LIMIT_BYTES:-10000000000}
      TRANSPORT_SAMPLE_SECONDS: ${TRANSPORT_SAMPLE_SECONDS:-30}
      TRANSPORT_BIN_SECONDS: ${TRANSPORT_BIN_SECONDS:-30}
      TRANSPORT_DETAIL_DAYS: ${TRANSPORT_DETAIL_DAYS:-7}
      TRANSPORT_AGGREGATE_MONTHS: ${TRANSPORT_AGGREGATE_MONTHS:-12}
      TRANSPORT_CHECKPOINT_SECONDS: ${TRANSPORT_CHECKPOINT_SECONDS:-60}
      TRANSPORT_EVALUATION_SECONDS: ${TRANSPORT_EVALUATION_SECONDS:-60}
      TRANSPORT_TRAINING_DAYS: ${TRANSPORT_TRAINING_DAYS:-30}
      TRANSPORT_CALIBRATION_DAYS: ${TRANSPORT_CALIBRATION_DAYS:-30}
      STORAGE_GUARD: ${STORAGE_GUARD:-true}
      GOMEMLIMIT: 768MiB
      GOMAXPROCS: "2"
      METRO_REFRESH_MILLISECONDS: ${METRO_REFRESH_MILLISECONDS:-500}
      METRO_CLIENT_ID: ${METRO_CLIENT_ID:-}
      METRO_CLIENT_SECRET: ${METRO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.5
    volumes:
      - transport_history:/app/transport-history
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      web:
        aliases: [lisboa-publica]
      private: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      wud.watch: "false"
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lisboapublica
      POSTGRES_USER: lisboapublica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=4MB]
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lisboapublica -d lisboapublica]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      wud.watch: "false"
networks:
  web:
    external: true
    name: server_web
  private:
    internal: true
volumes:
  database_data:
  transport_history:
